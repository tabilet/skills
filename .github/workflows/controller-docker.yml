name: Controller Docker acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TABILET_REQUIRE_DOCKER: "1"
      TABILET_TEST_DOCKER_IMAGE: python:3.12-slim
    steps:
      - uses: actions/checkout@v4
      - name: Verify local Docker daemon
        run: docker info
      - name: Prepare the acceptance image
        run: docker pull "$TABILET_TEST_DOCKER_IMAGE"
      - name: Exercise the real networkless container executor
        run: python3 -B -m unittest discover -s tests/container_acceptance -v
