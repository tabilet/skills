site_name: Tabilet Memory Bank
site_description: A minimal engineering harness — plain Markdown project memory and seven portable skills for coding agents
site_url: https://tabilet.github.io/skills/
repo_url: https://github.com/tabilet/skills
repo_name: tabilet/skills
docs_dir: docs
# Publish only the website guides. Repository references and publishing drafts
# stay out of generated pages, search results, and the sitemap.
# The English guides and their Simplified Chinese translations in docs/zh/ are
# listed one by one so the site contract check can hold the two sets in parity.
exclude_docs: |
  *.md
  !/index.md
  !/installation.md
  !/examples.md
  !/init.md
  !/next.md
  !/goal.md
  !/reconcile.md
  !/propose.md
  !/upgrade.md
  !/archive.md
  !/zh/index.md
  !/zh/installation.md
  !/zh/examples.md
  !/zh/init.md
  !/zh/next.md
  !/zh/goal.md
  !/zh/reconcile.md
  !/zh/propose.md
  !/zh/upgrade.md
  !/zh/archive.md
  /medium*.png
  /requirements.txt
  /assets/*.prompt.txt
extra_css:
  - assets/stylesheets/theme.css
copyright: '© 2026 Peter Bi · <a href="https://github.com/tabilet/skills/blob/main/LICENSE">MIT License</a>'

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

# `zh` enables the bundled lunr Chinese tokenizer so the translated guides are
# searchable rather than indexed as one long token.
#
# The i18n plugin publishes one build per locale: the English guides keep their
# paths, and each is resolved to its docs/zh/ counterpart for the Chinese build.
# That is what makes the top navigation language-correct — a Chinese page links
# to Chinese pages — and the plugin also injects the header language switcher,
# which points at the equivalent page in the other locale. Do not add
# `extra.alternate` by hand; the plugin owns that entry.
#
# `nav` below therefore names the English guides once. Every label it uses needs
# a `nav_translations` entry, or the Chinese pages show an English tab;
# site_contract in check.py fails on a missing label.
plugins:
  - search:
      lang:
        - en
        - zh
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
        - locale: zh
          name: 中文
          nav_translations:
            Home: 首页
            Get started: 开始使用
            Installation: 安装
            Choose a workflow: 选择工作流
            Skills: 技能
            Init: Init 初始化
            Next: Next 下一步
            Goal: Goal 目标
            Propose: Propose 提议
            Reconcile: Reconcile 协调
            Upgrade: Upgrade 升级
            Archive: Archive 归档

# The Chinese guides are translated from the English guides of the same name.
# site_contract requires the two sets to stay in parity. A Chinese heading that
# a guide deep-links to carries an explicit `{#ascii-id}` so the fragment
# survives translation; see the translation note in AGENTS.md.
# Keep this section last: check.py reads it as the final top-level key.
nav:
  - Home: index.md
  - Get started:
    - Installation: installation.md
    - Choose a workflow: examples.md
  - Skills:
    - Init: init.md
    - Next: next.md
    - Goal: goal.md
    - Propose: propose.md
    - Reconcile: reconcile.md
    - Upgrade: upgrade.md
    - Archive: archive.md
