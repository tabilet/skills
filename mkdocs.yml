site_name: Memory Bank
site_description: A minimal engineering harness — plain Markdown project memory and seven portable skills for coding agents
site_url: https://tabilet.github.io/skills/
repo_url: https://github.com/tabilet/skills
repo_name: tabilet/skills
docs_dir: docs
# Publish only the website guides. Repository references and publishing drafts
# stay out of generated pages, search results, and the sitemap.
exclude_docs: |
  *.md
  !/index.md
  !/installation.md
  !/examples.md
  !/init.md
  !/next.md
  !/goal.md
  !/reconcile.md
  !/propose.md
  !/upgrade.md
  !/archive.md
  /medium*.png
  /requirements.txt
  /assets/*.prompt.txt
extra_css:
  - assets/stylesheets/theme.css
copyright: '© 2026 Peter Bi · <a href="https://github.com/tabilet/skills/blob/main/LICENSE">MIT License</a>'

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Get started:
    - Installation: installation.md
    - Choose a workflow: examples.md
  - Skills:
    - Init: init.md
    - Next: next.md
    - Goal: goal.md
    - Propose: propose.md
    - Reconcile: reconcile.md
    - Upgrade: upgrade.md
    - Archive: archive.md
