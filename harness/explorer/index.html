<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabilet Explorer</title>
  <link rel="stylesheet" href="explorer.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Tabilet Explorer</p>
      <h1 id="project-name">Loading project…</h1>
      <p id="project-context" class="muted"></p>
    </div>
    <div class="top-actions">
      <label class="search-label" for="global-search">Search</label>
      <input id="global-search" type="search" placeholder="Search memory" autocomplete="off">
      <button id="refresh-project" type="button">Refresh project</button>
    </div>
  </header>

  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <div id="diagnostics" class="diagnostics" role="alert" hidden></div>

  <nav class="tabs" aria-label="Explorer views">
    <a href="?view=overview" data-view="overview">Overview</a>
    <a href="?view=timeline" data-view="timeline">Timeline</a>
    <a href="?view=todo" data-view="todo">To-do</a>
  </nav>

  <main id="app" tabindex="-1">
    <section id="view-overview" data-view-panel="overview" aria-labelledby="overview-title">
      <div class="section-heading"><div><p class="eyebrow">Project summary</p><h2 id="overview-title">Overview</h2></div><span id="overview-freshness" class="badge"></span></div>
      <div id="overview-content" class="loading">Loading overview…</div>
    </section>
    <section id="view-timeline" data-view-panel="timeline" aria-labelledby="timeline-title" hidden>
      <div class="section-heading"><div><p class="eyebrow">Recorded activity</p><h2 id="timeline-title">Timeline</h2></div><div class="filters"><label>Operation <select id="timeline-operation"><option value="">All</option><option>init</option><option>archive</option><option>propose</option><option>reconcile</option><option>next</option><option>goal</option><option>upgrade</option></select></label><label>Outcome <select id="timeline-outcome"><option value="">All</option><option>completed</option><option>blocked</option><option>failed</option><option>interrupted</option><option>cancelled</option><option>unfinished</option></select></label><label>Milestone <input id="timeline-milestone" size="6" placeholder="M01"></label><label>Instruction set <input id="timeline-instruction-set" size="18"></label><label>Version <input id="timeline-instruction-set-version" size="10"></label><label>Host <input id="timeline-host" size="12"></label><label>Model <input id="timeline-model" size="12"></label><label>Capture <select id="timeline-capture-method"><option value="">All</option><option>automatic</option><option>instruction_driven</option><option>imported</option></select></label><label>Coverage <select id="timeline-coverage"><option value="">All</option><option>not_requested</option><option>complete</option><option>partial</option><option>missing</option></select></label><label><input id="timeline-purged" type="checkbox"> Purged content</label><label>Since UTC <input id="timeline-since" size="20" placeholder="2026-01-01T00:00:00Z"></label><label>Until UTC <input id="timeline-until" size="20" placeholder="2026-12-31T23:59:59Z"></label><label>Order <select id="timeline-order"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></label></div></div>
      <div id="timeline-content" class="loading">Loading timeline…</div>
      <div id="timeline-pagination" class="pagination"></div>
    </section>
    <section id="view-todo" data-view-panel="todo" aria-labelledby="todo-title" hidden>
      <div class="section-heading"><div><p class="eyebrow">Advisory ledger view</p><h2 id="todo-title">To-do</h2></div><span id="todo-validation" class="badge"></span></div>
      <div id="todo-content" class="loading">Loading to-do list…</div>
    </section>
  </main>

  <aside id="detail-panel" class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
    <div class="detail-header"><h2 id="detail-title">Details</h2><button id="close-detail" type="button" aria-label="Close details">×</button></div>
    <div id="detail-content"></div>
  </aside>
  <div id="backdrop" class="backdrop" hidden></div>
  <script src="explorer.js"></script>
</body>
</html>
